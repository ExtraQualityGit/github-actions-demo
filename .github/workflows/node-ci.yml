name: Node.js CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v7
     - name: Use Node.js
       uses: actions/setup-node@v7
       with:
         node-version: "24"
     - name: Install dependencies
       run: npm install
     - name: Run test
       run: npm test